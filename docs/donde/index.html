<style>
  body{background:#0b1e2e;color:#e2e8f0;overflow-x:hidden}
  /* HERO aurora */
  .aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#0b1e2e}
  .aurora .g1{position:absolute;width:900px;height:900px;left:-200px;top:-300px;background:radial-gradient(circle at 40% 40%, rgba(14,165,233,.22), transparent 62%);filter:blur(40px)}
  .aurora .g2{position:absolute;width:800px;height:800px;right:-200px;top:-120px;background:radial-gradient(circle at 60% 40%, rgba(168,85,247,.18), transparent 62%);filter:blur(40px)}
  .aurora .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);background-size:48px 48px;mask-image:radial-gradient(900px circle at 50% 0%, black 30%, transparent 70%)}
  /* TIMELINE — línea protagonista */
  .track-wrap{overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;padding:8px 0 28px;margin:0 12px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:20px;backdrop-filter:blur(6px)}
  .track-wrap::-webkit-scrollbar{height:5px}
  .track-wrap::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:999px;margin:0 12px}
  .track-wrap::-webkit-scrollbar-thumb{background:rgba(14,165,233,.80);border-radius:999px}
  .track{position:relative;display:flex;gap:14px;min-width:1440px;padding:64px 32px 64px 32px;align-items:center;justify-content:center}
  /* continuous looping line - SVG behind */
  .loop-svg{position:absolute;left:32px;right:32px;top:50%;transform:translateY(-50%);height:240px;width:calc(100% - 64px);pointer-events:none;overflow:visible}
  .step{position:relative;flex:0 0 228px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center}
  .step.top{padding-bottom:132px}
  .step.bottom{padding-top:132px}
  /* year pill */
  .pill{font-size:13px;font-weight:800;letter-spacing:.02em;padding:7px 16px;border-radius:999px;color:white;box-shadow:0 8px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35);border:1.5px solid rgba(255,255,255,.22)}
  /* circle */
  .circle{width:100px;height:100px;border-radius:999px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 14px 34px rgba(0,0,0,.48), inset 0 2px 0 rgba(255,255,255,.38), 0 0 0 6px rgba(255,255,255,.04);border:3px solid rgba(255,255,255,.98);cursor:pointer;transition:transform .35s cubic-bezier(.23,1,.32,1), box-shadow .35s}
  .circle:hover{transform:scale(1.07) translateY(-3px);box-shadow:0 20px 44px rgba(0,0,0,.52), 0 0 0 8px rgba(255,255,255,.05)}
  .circle svg{width:44px;height:44px;color:white;filter:drop-shadow(0 1px 2px rgba(0,0,0,.28))}
  .circle::after{content:'';position:absolute;inset:-12px;border-radius:50%;border:1.5px solid currentColor;opacity:.18;pointer-events:none}
  /* vertical stem */
  .stem{width:2.5px;height:44px;opacity:.95;border-radius:999px}
  /* text blocks */
  .tblock{width:200px;text-align:center}
  .tblock h3{font-size:13.5px;letter-spacing:.10em;font-weight:800;text-transform:uppercase;line-height:1.2}
  .tblock p{font-size:11.5px;line-height:1.45;margin-top:6px;color:#cbd5e1;font-weight:400}
  .tblock .line{height:2.5px;width:48px;margin:10px auto 0;border-radius:999px;opacity:.95}
  /* loop arms (the U shapes) */
  .arm{position:absolute;left:50%;width:220px;height:120px;pointer-events:none;border:2.5px solid;opacity:.95}
  .step.top .arm{top:50%;transform:translate(-50%,-50%);border-bottom:none;border-radius:110px 110px 0 0}
  .step.bottom .arm{top:50%;transform:translate(-50%,-50%);border-top:none;border-radius:0 0 110px 110px}
  .step:last-child .arm{display:none}
  .dot{width:10px;height:10px;border-radius:999px;background:white;box-shadow:0 0 0 4px #0b1e2e, 0 2px 8px rgba(0,0,0,.4);position:absolute;left:50%;transform:translateX(-50%);z-index:2}
  .step.top .dot{top:calc(50% - 5px)}
  .step.bottom .dot{top:calc(50% - 5px)}
  /* detail card under/over — distribución pro */
  .mini{position:absolute;left:50%;transform:translateX(-50%);width:216px;background:rgba(255,255,255,.98);backdrop-filter:blur(12px);border-radius:16px;padding:11px;box-shadow:0 18px 42px rgba(0,0,0,.42);border:1.5px solid rgba(255,255,255,.7);opacity:0;pointer-events:none;transition:all .38s cubic-bezier(.23,1,.32,1)}
  .step:hover .mini{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
  .step.top .mini{bottom:12px;transform:translateX(-50%) translateY(8px)}
  .step.bottom .mini{top:12px;transform:translateX(-50%) translateY(-8px)}
  .mini img{width:100%;height:76px;object-fit:cover;border-radius:10px}
  .mini .btn{font-size:11px;font-weight:700;padding:6px 10px;border-radius:999px;width:100%}

  /* popup */
  #proModal{backdrop-filter:blur(0px);transition:backdrop-filter .3s}
  #proModal.open{backdrop-filter:blur(14px)}
  #proModal .panel{transform:scale(.96) translateY(14px);opacity:0;transition:all .4s cubic-bezier(.23,1,.32,1)}
  #proModal.open .panel{transform:scale(1) translateY(0);opacity:1}
  .preserve-3d{transform-style:preserve-3d}
</style>

<script>
AOS.init({duration:850,once:true,offset:40,easing:'ease-out-cubic'});
const galleries=[
  ["hablar1.png","hablar.jpeg","escribir.jpeg"],
  ["jardin.jpg","revista.jpg","letra.jpg"],
  ["carro.webp","tv.webp" ,"maquina.jpeg"],
  ["seguredes.jpg","computador.jpeg","catedra.jpg"],
  ["video.jpg","hi5.png","video.jpg"],
  ["bot.jpg","tt.jpeg","descarga.png"]
];
const titles=["Oralidades","Escrituras","Tecno mediado / mundo mecánico / electrónico","Era digital","Era socio digital / redes","Era de la IA"];
const stationColors=["#22c55e","#f97316","#ec4899","#a855f7","#0ea5e9","#10b981"];
const fullTexts=[
  `<p><span class="font-bold" style="color:#22c55e">Mi primer momento</span> fue cuando empecé a decir mamá y papá. Mi mamá cuenta que también empecé a decir “dada” cuando quería que me dieran una cuchara; ella comenta que le costó saber a qué me refería cuando balbuceaba esa palabra.</p><p><span class="font-bold" style="color:#22c55e">Oralidad en mi momento más alto:</span> Mi oralidad en el momento más alto fue cuando aprendí a hablar, porque lo hice cantando la canción "Vuela vuela" de Magneto, hubo algo con la relación entre la música y la oralidad que me ayudó a aprender a hablar rápido. Por otra parte, en mi infancia, en la escuela descubrieron mi habilidad para recitar y hacer sainetes. Pero lo que más recuerdo fue una obra que tuvimos que presentar prácticamente frente a todo el pueblo; repasamos tanto con mis compañeros que nos fue muy bien y logramos sacar muchas sonrisas al público.</p><p><span class="font-bold" style="color:#22c55e">Mi momento más difícil</span> fue cuando era niño: salimos a jugar con mis primos y se hizo tarde. Entre todos quedamos en decir que algo nos había pasado, pero al final ellos dijeron la verdad, quedando yo en ridículo frente a toda mi familia que se encontraba reunida en la casa de mi abuela. Ese día fue muy difícil porque no sabía a dónde esconderme y fui obligado a explicar lo que había pasado.</p>`,
  `<p><span class="font-bold" style="color:#f97316">Cuando aprendí</span> a escribir fue en el jardín. Cuenta mi mamá que aprendí a hacer bolitas y palitos, y cuando fui al jardín aprendí a realizar las vocales de una manera más fácil porque ya tenía desarrollada la motricidad fina.</p><p><span class="font-bold" style="color:#f97316">Mi momento culmen</span> fue en la universidad. Recuerdo que tenía muy mala ortografía, pero gracias a una materia del profesor José Luis Romo aprendí a escribir de manera correcta. Tuve que esforzarme mucho por aprender a colocar las tildes y también los signos de puntuación, porque no se aceptaban errores de puntuación; es así que de loa artículos que debiamos entregar, mi artículo fue publicado en la primera edición y no tuve correcciones.</p><p><span class="font-bold" style="color:#f97316">Mi momento más difícil</span> fue en el colegio, porque mi letra era y sigue siendo fea. Recuerdo que la profesora de español me hizo quedar mal frente a todos mis compañeros porque me recalcó que, para colmo, la letra de mis otros hermanos era fea. Ahora escribo diferente e intento mejorar.</p>`,
  `<p><span class="font-bold" style="color:#ec4899">Mi primer encuentro</span> con la tecnología fue en mi infancia. Mi papá nos había comprado unos juguetes que emitían un sonido particular. Recuerdo haber usado un martillo para romper el juguete y ver por qué emitía ese sonido; fui castigado, por supuesto. Recuerdo también los momentos de felicidad que me daba el poder hablar por teléfono con mi papá, que se encontraba lejos por situaciones de trabajo; le contaba mis ocurrencias y todo lo que había realizado durante la semana.</p><p><span class="font-bold" style="color:#ec4899">Mi momento más difícil</span> con la tecnología fue cuando estaba en grado sexto. En la casa solo había una máquina de escribir y teníamos que turnarnos con mis hermanos para realizar los trabajos. Después de todo, logramos que un familiar nos prestara otra máquina de escribir, pero realizar los trabajos igual fue difícil porque era muy pesada para nuestra edad y teníamos que caminar mucho para regresar a devolverla.</p><p><span class="font-bold" style="color:#ec4899">Mi mejor momento</span> fue cuando mi papá compró un televisor. Recuerdo que visitábamos la casa de mi abuelo para poder mirar la televisión, y no teníamos permiso de ver dibujos animados, especialmente Dragon Ball Z. Mi abuelo decía que “esas cosas eran del diablo”. Cuando llegó el primer televisor a nuestro hogar, por fin logramos mirar los dibujos animados que nos gustaban sin restricciones.</p>`,
  `<p><span class="font-bold" style="color:#a855f7">Mi primer encuentro</span> se dio en mi colegio, donde empezamos a usar computadores. Recuerdo que teníamos que llevar un disquete para guardar los trabajos que se realizaban en computadores con Windows 95.</p><p><span class="font-bold" style="color:#a855f7">Mi momento culmen</span> en la era digital fue realizando el trabajo de grado: me correspondía realizar la programación del sitio web y, por esa situación, tuve que aprender cosas que no se enseñaban en la universidad. Gracias al trabajo junto a mis compañeros logramos obtener como resultado un trabajo de grado laureado.</p><p><span class="font-bold" style="color:#a855f7">Mi momento más difícil</span> fue en una cátedra de formación humanística en la universidad. Ya que, por mis conocimientos obtenidos en semestres de la carrera, hice un buen ejercicio en la entrega de un trabajo, pero el profesor me puso cero porque no creía que yo había realizado la edición de un video. Recuerdo que me tocó volver a realizar el trabajo frente a él para convencerlo de que yo era el autor de la edición. Fue un momento muy frustrante porque me había esforzado.</p>`,
  `<p><span class="font-bold" style="color:#0ea5e9">Mi primer encuentro</span> se dio en una sala de internet en mi pueblo, con la creación de mi perfil de Hi5. Fue un momento especial porque hice amistad con una amiga que vive en Ecuador y aún mantenemos contacto después de mucho tiempo y a pesar de la distancia.</p><p><span class="font-bold" style="color:#0ea5e9">Mi mejor momento</span> se dio cuando, por la situación de la pandemia, tuve que dictar clases durante mis prácticas docentes. Hice lo posible para mantener atentos a mis estudiantes, e inclusive, para hacer más atractivas las clases, ellos tuvieron que aprender a editar videos y presentarlos durante la clase. Fue muy satisfactorio porque fue bonito ver cómo explicaban sus tareas y, en muchas ocasiones, eran ayudados por sus papás. Me gustó mucho la experiencia; incluso hice un artículo sobre esos momentos.</p><p> </p>`,
  `<p><span class="font-bold" style="color:#10b981">Mi primer momento</span> en la era de la IA fue cuando empecé a descubrir lo referente a chatbots. Siempre me ha apasionado la informática y por eso consultaba sobre esos temas; recuerdo haber realizado un chatbot sencillo con lenguaje de marcado, con preguntas sencillas.</p><p><span class="font-bold" style="color:#10b981">Mi momento más bajo</span> fue cuando aprendí a manejar modelos de inteligencia artificial. Siempre sentí curiosidad por aprender cómo funciona la inteligencia artificial. Hice un curso de inteligencia artificial nivel básico y la última entrega fue muy frustrante, porque pasé una semana sin poder resolver un inconveniente y no lograba que mi código funcionara de manera correcta.</p><p><span class="font-bold" style="color:#10b981">Creo que estoy viviendo mi momento más alto</span> porque estoy aprendiendo a usar plataformas de manera correcta y cada vez adquiero mayor experiencia en lo referente a la ingeniería de prompts. Mi intención es aprender cada vez más habilidades sobre el uso de inteligencia artificial en el ámbito educativo y así poder aprovechar estas nuevas herramientas. PD: Este trabajo fue realizado con inteligencia artificial en su implementación.</p>`
];
const trackWrap=document.getElementById('trackWrap');
let isDown=false,sx,sl;
trackWrap.addEventListener('mousedown',e=>{isDown=true;trackWrap.style.cursor='grabbing';sx=e.pageX-trackWrap.offsetLeft;sl=trackWrap.scrollLeft});
window.addEventListener('mouseup',()=>{isDown=false;trackWrap.style.cursor='grab'});
trackWrap.addEventListener('mouseleave',()=>isDown=false);
trackWrap.addEventListener('mousemove',e=>{if(!isDown) return; e.preventDefault(); const x=e.pageX-trackWrap.offsetLeft; trackWrap.scrollLeft=sl-(x-sx)*1.3});
trackWrap.style.cursor='grab';
window.addEventListener('keydown',e=>{
  if(modal.classList.contains('open')){
    if(e.key==='Escape') closePopup();
    if(e.key==='ArrowRight') popupStep(1);
    if(e.key==='ArrowLeft') popupStep(-1);
  }
});
// popup — solo X para cerrar
const modal=document.getElementById('proModal'), popupImg=document.getElementById('popupImg'), popupTitle=document.getElementById('popupTitle'), popupText=document.getElementById('popupText'), popupDots=document.getElementById('popupDots'), popupThumbs=document.getElementById('popupThumbs');
let state={g:0,i:0};
function openPopup(g,i){ state={g,i}; render(); modal.classList.remove('hidden'); modal.classList.add('flex'); requestAnimationFrame(()=>modal.classList.add('open')); document.body.style.overflow='hidden';}
function closePopup(){ modal.classList.remove('open'); setTimeout(()=>{modal.classList.add('hidden'); modal.classList.remove('flex'); document.body.style.overflow='';},250)}
function popupStep(d){ let n=state.i+d; const L=galleries[state.g].length; n=(n+L)%L; state.i=n; render(); }
function render(){
  const g=state.g,i=state.i;
  const col=stationColors[g];
  popupImg.src=galleries[g][i];
  popupTitle.textContent=titles[g];
  popupTitle.style.color=col;
  popupText.innerHTML=fullTexts[g];
  const nextBtn=document.getElementById('popupNext');
  const prevBtn=document.getElementById('popupPrev');
  if(nextBtn){ nextBtn.style.background=col; nextBtn.style.color='white'; nextBtn.style.borderColor=col; }
  if(prevBtn){ prevBtn.style.borderColor=col; prevBtn.style.color=col; }
  if(popupDots) popupDots.innerHTML=galleries[g].map((_,k)=>'<button onclick="state.i='+k+';render()" class="'+(k===i?'w-6':'w-1.5')+' h-1.5 rounded-full transition" style="background:'+(k===i?col:'rgba(255,255,255,.55)')+'"></button>').join('');
  if(popupThumbs) popupThumbs.innerHTML=galleries[g].map((s,k)=>'<button onclick="state.i='+k+';render()" class="overflow-hidden rounded-lg h-[64px] border-2 '+(k===i?'shadow':'opacity-70 hover:opacity-100')+'" style="border-color:'+(k===i?col:'transparent')+'"><img src="'+s+'" class="w-full h-full object-cover"></button>').join('');
}
</script>
</body>
</html>

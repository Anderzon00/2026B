<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Docentes | Rizoma Desbloqueado</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0c10;
            color: #f0f2f5;
            font-family: 'Manrope', system-ui, sans-serif;
            text-align: center;
            padding: 2rem;
        }
        .carga { max-width: 440px; }
        .carga h1 { font-size: 1.3rem; margin-bottom: 0.5rem; }
        .carga p { color: #8a92a1; font-size: 0.9rem; margin: 0 0 1rem; }
        .spinner {
            width: 42px; height: 42px;
            margin: 1rem auto;
            border-radius: 50%;
            border: 3px solid rgba(56,217,169,0.2);
            border-top-color: #38d9a9;
            animation: girar 0.9s linear infinite;
        }
        @keyframes girar { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="carga">
        <div class="spinner"></div>
        <h1>Preparando el rizoma...</h1>
        <p>Acceso directo para docentes: los requisitos se marcan como cumplidos automáticamente.</p>
    </div>
    <script>
        // Marca automáticamente como cumplidos todos los requisitos de desbloqueo
        // para que el docente acceda al rizoma libre sin claves ni misiones.
        try {
            localStorage.setItem("archivoExperienciaIniciada", "true");
            localStorage.setItem("archivoVideoInicialVisto", "true");
            localStorage.setItem("onboardingCompletado", "true");
            localStorage.setItem("misAudiosFrecuencia", "2");     // meta: 2 audios
            localStorage.setItem("misElementosRizoma", "3");      // meta: 3 elementos
            localStorage.setItem("nodosDesbloqueados", JSON.stringify(["N-002", "N-003"]));
        } catch (e) {
            // Si no se puede escribir en localStorage, continuamos igual.
        }
        location.replace("index.html");
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preinscripción de Cátedras</title>
    <style>
        /* Contenedor para hacer el iframe responsivo */
        .iframe-container {
            width: 100%;
            max-width: 1000px; /* Ancho máximo para que no se vea gigante en pantallas grandes */
            margin: 0 auto; /* Centrar en la pantalla */
            height: 100vh; /* Ocupa el 100% de la altura de la ventana */
            min-height: 800px; /* Altura mínima recomendada */
        }

        /* Estilos directos al iframe para quitar bordes */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 10px; /* Bordes ligeramente redondeados (opcional) */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* Pequeña sombra para resaltar (opcional) */
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <iframe src="https://script.google.com/macros/s/AKfycbwuarMsRFOUPw6MV1JbRRkWvtWUaTm86dm4RQu5AgM9_c-I8_eKBC2j6LxeJgF3nUSO/exec" title="Formulario de Preinscripción"></iframe>
    </div>

</body>
</html>
